name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh && ./NotifyMe.app/Contents/MacOS/NotifyMe --selftest
        env:
          VERSION: ${{ github.ref_name }}
      - run: ditto -c -k --keepParent NotifyMe.app NotifyMe.zip
      - run: gh release create "$GITHUB_REF_NAME" NotifyMe.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
